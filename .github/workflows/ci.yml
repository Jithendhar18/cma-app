name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Read-only token: CI only checks code. It never writes to the repo or deploys.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes a run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vitest 5 needs Node 22.12 or newer; "22" resolves to the latest 22.x.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Decision S4: the service-role key must never reach the frontend, Git or browser environment variables.
      - name: Guard against committed secrets
        run: npm run guard:secrets

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Tests run in jsdom with a pinned clock and cleared storage; no real browser data is involved.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Guard against secrets in the built bundle
        run: npm run guard:secrets -- --dist dist
